<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker OS - Direct Browser Call & Chat</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #090d16; color: #f8fafc; padding: 15px; }
  .container { max-width: 600px; margin: auto; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 14px 18px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
  .status { font-size: 12px; background: #10b981; color: #022c22; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
  .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
  .id-box { background: #020617; padding: 10px; border-radius: 8px; font-family: monospace; color: #38bdf8; font-size: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; margin-top: 8px; }
  button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-video { background: #10b981; color: #022c22; }
  .btn-audio { background: #f59e0b; color: #022c22; }
  .btn-end { background: #ef4444; color: #fff; display: none; }
  .btn-copy { width: auto; padding: 6px 12px; margin: 0; font-size: 12px; background: #334155; }
  .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  video { width: 100%; height: 180px; background: #020617; border-radius: 10px; object-fit: cover; border: 1px solid #334155; }
  .chat-box { height: 180px; overflow-y: auto; background: #020617; padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 8px; font-size: 14px; }
  .msg-me { color: #38bdf8; margin-bottom: 6px; text-align: right; }
  .msg-peer { color: #a7f3d0; margin-bottom: 6px; text-align: left; }
  .meta { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div><strong>Worker OS P2P Call</strong></div>
    <span class="status" id="netStatus">Connecting...</span>
  </div>

  <!-- নিজের আইডি ও ডিরেক্ট লিংক -->
  <div class="card">
    <div class="meta">আপনার ব্রাউজার ID (অন্যকে এটি বা নিচের লিংকটি দিন):</div>
    <div class="id-box">
      <span id="myId">লোড হচ্ছে...</span>
      <button class="btn-copy" onclick="copyInviteLink()">লিংক কপি</button>
    </div>
  </div>

  <!-- অন্য ব্রাউজারে কল বা চ্যাট সংযোগ -->
  <div class="card">
    <div class="meta">যার সাথে কথা বলবেন তার ID লিখুন:</div>
    <input type="text" id="remoteId" placeholder="যেমন: WOS-4829">
    <div class="btn-row">
      <button class="btn-video" onclick="startCall(true)">📹 ভিডিও কল</button>
      <button class="btn-audio" onclick="startCall(false)">📞 অডিও কল</button>
    </div>
    <button class="btn-end" id="endCallBtn" onclick="endCall()">❌ কল কাটুন</button>
  </div>

  <!-- লাইভ ভিডিও স্ক্রিন -->
  <div class="card" id="videoSection" style="display:none;">
    <div class="meta" id="callInfo">কল চলছে...</div>
    <div class="video-grid">
      <div>
        <div class="meta">আপনি (Local)</div>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div>
        <div class="meta">অন্য প্রান্ত (Remote)</div>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <!-- ব্রাউজার-টু-ব্রাউজার ডিরেক্ট চ্যাট -->
  <div class="card">
    <div class="meta" style="margin-bottom:6px;">সরাসরি P2P চ্যাট:</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="btn-row">
      <input type="text" id="chatInput" placeholder="মেসেজ লিখুন..." style="margin-top:0;">
      <button onclick="sendChat()" style="width:90px; margin-top:0;">পাঠান</button>
    </div>
  </div>
</div>

<script>
  // ইউনিক Worker OS আইডি তৈরি বা লোড করা
  let savedId = localStorage.getItem("wos_peer_id");
  if (!savedId) {
    savedId = "WOS-" + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem("wos_peer_id", savedId);
  }

  const peer = new Peer(savedId);
  let localStream = null;
  let currentCall = null;
  let dataConn = null;

  peer.on("open", (id) => {
    document.getElementById("myId").innerText = id;
    document.getElementById("netStatus").innerText = "● Online P2P";

    // যদি কেউ ইনভাইট লিংকের মাধ্যমে ঢোকে (?call=WOS-XXXX)
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get("call");
    if (targetId && targetId !== id) {
      document.getElementById("remoteId").value = targetId;
      connectData(targetId);
    }
  });

  peer.on("error", (err) => {
    document.getElementById("netStatus").innerText = "Error: " + err.type;
  });

  // ইনকামিং চ্যাট কানেকশন গ্রহণ
  peer.on("connection", (conn) => {
    dataConn = conn;
    setupChatListeners();
  });

  function connectData(targetId) {
    if (!dataConn || dataConn.peer !== targetId) {
      dataConn = peer.connect(targetId);
      setupChatListeners();
    }
  }

  function setupChatListeners() {
    dataConn.on("open", () => {
      appendMsg("System", "ব্রাউজার সংযুক্ত হয়েছে! এখন চ্যাট ও কল করতে পারেন।", "msg-peer");
    });
    dataConn.on("data", (data) => {
      appendMsg(dataConn.peer, data, "msg-peer");
    });
  }

  function sendChat() {
    const targetId = document.getElementById("remoteId").value.trim();
    const text = document.getElementById("chatInput").value.trim();
    if (!text) return;
    if (!targetId) return alert("আগে অপর প্রান্তের ID দিন!");

    connectData(targetId);
    setTimeout(() => {
      if (dataConn && dataConn.open) {
        dataConn.send(text);
        appendMsg("আপনি", text, "msg-me");
        document.getElementById("chatInput").value = "";
      } else {
        alert("অপর প্রান্তের ব্রাউজারটি অনলাইন নেই বা কানেক্ট হচ্ছে, ১ সেকেন্ড পর আবার চেষ্টা করুন।");
      }
    }, 300);
  }

  function appendMsg(sender, text, cls) {
    const box = document.getElementById("chatBox");
    box.innerHTML += `<div class="${cls}"><strong>${sender}:</strong> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  // ইনকামিং অডিও/ভিডিও কল গ্রহণ
  peer.on("call", async (call) => {
    const accept = confirm(call.peer + " থেকে কল এসেছে! রিসিভ করবেন?");
    if (!accept) return call.close();

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      showVideoUI(localStream);
      call.answer(localStream);
      handleCallStream(call);
    } catch (e) {
      alert("ক্যামেরা বা মাইক্রোফোন পারমিশন দিন: " + e.message);
    }
  });

  // আউটগোয়িং কল শুরু করা
  async function startCall(withVideo) {
    const targetId = document.getElementById("remoteId").value.trim();
    if (!targetId) return alert("যাকে কল করবেন তার ID লিখুন!");

    connectData(targetId);
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
      showVideoUI(localStream);
      const call = peer.call(targetId, localStream);
      handleCallStream(call);
    } catch (e) {
      alert("মাইক্রোফোন/ক্যামেরা চালু করা যায়নি: " + e.message);
    }
  }

  function handleCallStream(call) {
    currentCall = call;
    document.getElementById("endCallBtn").style.display = "block";
    call.on("stream", (remoteStream) => {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    });
    call.on("close", () => endCall());
  }

  function showVideoUI(stream) {
    document.getElementById("videoSection").style.display = "block";
    document.getElementById("localVideo").srcObject = stream;
  }

  function endCall() {
    if (currentCall) currentCall.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    document.getElementById("videoSection").style.display = "none";
    document.getElementById("endCallBtn").style.display = "none";
  }

  function copyInviteLink() {
    const myId = document.getElementById("myId").innerText;
    const url = window.location.origin + window.location.pathname + "?call=" + myId;
    navigator.clipboard.writeText(url);
    alert("ইনভাইট লিংক কপি হয়েছে! যেকোনো দেশে এটি পাঠালে সে সরাসরি আপনার সাথে যুক্ত হবে:\n" + url);
  }
</script>
</body>
</html>
